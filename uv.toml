# The repository's only uv settings. uv ignores the [tool.uv] table of a pyproject.toml next to
# this file, so pyproject.toml has none (ADR-0002); tests/test_toolchain_pins.py holds both facts.
#
# Only uv's own build of the pinned Python (.python-version) is used, never a machine one.
python-preference = "only-managed"

# A copy of the Makefile's UV_VERSION: any other uv refuses to run here.
required-version = "==0.12.24"
